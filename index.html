<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kassenbuch</title>
  <meta name="theme-color" content="#f4efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kassenbuch">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <h1>Kassenbuch</h1>
    <button type="button" id="bestandBtn" class="bestand">
      <span>Kassenbestand</span>
      <strong id="bestand">–</strong>
    </button>
  </header>

  <div id="warn" class="warn" hidden></div>
  <main id="list" class="list" aria-live="polite"></main>

  <footer class="actions">
    <div class="row">
      <label class="btn primary" for="camZbon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span><b>Tagesabschluss</b><small>Z-Bon scannen</small></span>
      </label>
      <label class="btn primary alt" for="camAusgabe">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span><b>Ausgabe</b><small>Beleg scannen</small></span>
      </label>
    </div>
    <div class="row">
      <button class="btn ghost" id="galleryBtn" type="button">Galerie</button>
      <button class="btn ghost" id="manualBtn" type="button">Von Hand</button>
      <button class="btn ghost strong" id="exportBtn" type="button">Excel</button>
    </div>
    <input id="camZbon" type="file" accept="image/*" capture="environment" hidden>
    <input id="camAusgabe" type="file" accept="image/*" capture="environment" hidden>
    <input id="galleryInput" type="file" accept="image/*" hidden>
  </footer>

  <!-- Erster Start -->
  <section id="setup" class="overlay" hidden>
    <div class="card center">
      <h2>Einrichtung</h2>
      <p id="setupText">Die Texterkennung wird einmalig auf dieses Gerät geladen. Danach funktioniert alles ohne Internet.</p>
      <div class="bar"><div id="setupBar"></div></div>
    </div>
  </section>

  <!-- Bon wird gelesen -->
  <section id="busy" class="overlay" hidden>
    <div class="card center">
      <img id="busyImg" alt="" class="thumb">
      <h2 id="busyText">Wird gelesen …</h2>
      <div class="bar"><div id="busyBar"></div></div>
      <p class="hint">Das dauert ein paar Sekunden.</p>
    </div>
  </section>

  <!-- Auswahl (Galerie, Von Hand, Excel) -->
  <section id="choice" class="overlay sheet" hidden>
    <div class="card">
      <h2 id="choiceTitle"></h2>
      <p id="choiceHint" class="hint"></p>
      <div id="choiceList" class="choices"></div>
      <button type="button" class="btn ghost full" id="choiceCancel">Abbrechen</button>
    </div>
  </section>

  <!-- Prüfen und speichern -->
  <section id="editor" class="overlay sheet" hidden>
    <form id="form" class="card" novalidate>
      <h2 id="editorTitle"></h2>
      <p id="editorHint" class="hint"></p>
      <div id="fields"></div>
      <div id="calc" class="calc" hidden></div>
      <div class="row">
        <button type="button" class="btn ghost" id="cancelBtn">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
      <button type="button" class="link danger" id="deleteBtn" hidden>Eintrag löschen</button>
    </form>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="parser.js"></script>
  <script src="kassenbuch.js"></script>
  <script src="xlsx.js"></script>
  <script src="app.js"></script>
</body>
</html>
